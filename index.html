<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>THE ITALIAN EXAM 🇮🇹</title>
<style>
:root{--bg:#15192d;--panel:#252a46;--ink:#fff4dc;--gold:#ffdd83;--pink:#ff83a6;--green:#8be3bd;--edge:#080d21;--soft:#d9d5e8}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at 50% -20%,#4b3158,var(--bg) 65%);color:var(--ink);font:16px/1.5 ui-monospace,Consolas,monospace;min-height:100dvh}
button,input{font:inherit}
button{touch-action:manipulation;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.wrap{max-width:680px;margin:auto;padding:18px 15px 50px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12px}
.sound{min-height:42px}
.bar{height:14px;background:#101327;border:3px solid #070a17;margin:13px 0 24px}
.fill{height:100%;background:linear-gradient(90deg,var(--green),var(--gold));width:0%;transition:width .35s}
.screen{background:var(--panel);border:4px solid var(--edge);box-shadow:7px 7px 0 #090b19;padding:clamp(16px,4vw,29px);min-height:420px}
.tag{color:var(--green);font-size:12px;letter-spacing:2px;font-weight:bold}
.hero{font-size:clamp(29px,7vw,45px);line-height:1.17;color:var(--gold);text-shadow:3px 3px #111327;margin:15px 0}
.sub{color:#c6c5d8}
.prof{font-size:66px;text-align:center;margin:15px 0;filter:drop-shadow(4px 5px #141625)}
.btn{display:block;width:100%;min-height:51px;border:3px solid #101020;background:var(--gold);color:#17172a;font-weight:900;box-shadow:4px 4px 0 #090b18;padding:10px;margin:10px 0;text-align:left}
.btn:active{transform:translate(3px,3px);box-shadow:1px 1px #090b18}
.btn.alt{background:var(--soft)}
.btn.good{background:var(--green)}
.btn.bad{background:#ffa1a1}
.btn:disabled{opacity:.5;cursor:not-allowed}
.mini{font-size:13px}
.box{background:#161a31;border:2px solid #50516c;padding:13px;margin:15px 0}
.feedback{color:var(--gold);min-height:30px}
.center{text-align:center}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:15px 0}
.chip{border:2px solid #101020;background:#e9d7f1;padding:10px;color:#17172a;min-height:44px}
.chip:disabled{opacity:.4}
.slots{min-height:66px;border:2px dashed var(--gold);padding:9px;display:flex;gap:6px;flex-wrap:wrap}
.cardgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.tile{height:74px;font-size:clamp(13px,3vw,18px);background:#eee1c8;color:#11152b;border:3px solid #0b1026;font-weight:bold;overflow-wrap:anywhere}
.tile.open{background:var(--green)}
.tile.done{opacity:.55;background:#c8bad8}
.order{font-size:14px}
.order span{display:inline-block;background:#e0e6c4;color:#1e2432;padding:5px;margin:3px}
.timer{font-size:27px;color:var(--gold);font-weight:bold}
.two{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.two .btn{font-size:13px;min-height:65px}
.stamp{display:inline-block;border:4px double var(--pink);padding:9px;transform:rotate(-4deg);color:var(--pink);font-weight:bold;margin:12px 0}
.photo-card{background:#12172c;border:3px solid #0b1026;padding:8px;box-shadow:4px 4px 0 #090b18;margin:12px 0}
.photo-grid{display:grid;grid-template-columns:1fr;gap:12px;margin:12px 0 6px}
.photo-grid.two-col{grid-template-columns:1fr 1fr}
.photo-shot{width:100%;display:block;border:3px solid var(--gold);aspect-ratio:4/5;object-fit:cover;background:#0f1221}
.photo-shot.wide{aspect-ratio:16/9}
.caption{font-size:12px;color:#d5d2e6;margin-top:7px;text-align:center}
.small-badge{display:inline-block;background:var(--pink);color:#1f1020;border:2px solid #101020;padding:6px 10px;font-size:12px;font-weight:900;margin-top:10px}
.footer{font-size:11px;text-align:center;color:#adaec4;margin:20px 0}
hr.sep{border:none;border-top:2px dashed #59607a;margin:15px 0}
@media(max-width:500px){.photo-grid.two-col{grid-template-columns:1fr}.two{grid-template-columns:1fr}}
@media(max-width:360px){.wrap{padding:12px 9px}.screen{padding:14px}.tile{height:60px}}
</style>
</head>

<main class="wrap">

<section class="screen" id="app" aria-live="polite"></section>
<footer class="footer">NOT AFFILIATED WITH ANY REAL UNIVERSITY · 100% UNOFFICIAL</footer>

function sound(ok=true){beep(ok?660:180,.09);if(ok)setTimeout(()=>beep(880,.13),100)}
document.getElementById('sound').onclick=()=>{muted=!muted;document.getElementById('sound').textContent=muted?'🔇 SOUND OFF':'🔊 SOUND ON';if(!muted)beep()};
function progress(){let pct=stage===0?0:stage>=6?100:Math.round((stage-1)/total*100);fill.style.width=pct+'%';document.querySelector('.bar').setAttribute('aria-valuenow',pct)}
function draw(html){app.innerHTML=html;progress();window.scrollTo({top:0,behavior:'instant'})}
function heading(n,title,detail){return `<div class="tag">EXAM ${n} / 05 · PROFESSOR PANAGIOTIS</div><h1 class="hero">${title}</h1><p class="sub">${detail}</p>`}
function next(){stage++;sound();render()}
function render(){clearInterval(gameTimer);gameTimer=null;lock=false;if(stage===0)return welcome();if(stage===1)return simulator();if(stage===2)return showQuiz();if(stage===3)return showWords();if(stage===4)return showMemory();if(stage===5)return showPasta();return finale()}
function welcome(){draw(`
  <div class="tag">CLASSIFIED · VERY SERIOUS EXAMINATION</div>
  <div class="prof">👨🏻‍🏫</div>
  <h1 class="hero center">THE ITALIAN<br>EXAM 🇮🇹</h1>
  <p class="center">Candidate: <b>KAMI</b><br>Examiner: <b>PROFESSOR PANAGIOTIS</b></p>
  <div class="photo-grid two-col">
    <div class="photo-card"><img class="photo-shot" alt="Kami" src="${PHOTOS.kamiHome}"><div class="caption">Candidate Kami · officially adorable</div></div>
    <div class="photo-card"><img class="photo-shot wide" alt="Professor Panagiotis" src="${PHOTOS.professor}"><div class="caption">Professor Panagiotis · strict on paper, suspiciously soft in real life</div></div>
  </div>
  <div class="box center">5 tests. 1 suspiciously strict professor.<br>Absolutely no cheating.*<br><span class="mini">*Unless you are cute. Then the rules become unclear.</span></div>
  <div class="center"><span class="small-badge">SPECIAL NOTE: saying “one time in my life I think I am too competitive” is accepted as emotional evidence.</span></div>
  <button class="btn" id="start">▶ ENTER THE EXAM ROOM</button>
  <p class="mini center sub">Your results are not stored. Every new visit starts from zero.</p>
`);document.getElementById('start').onclick=()=>{stage=1;render()}}
function simulator(){draw(heading('01','BOYFRIEND SIMULATOR','Choose your reply. There are no wrong ways to be yourself.')+`
  <div class="box"><b>📱 Panagiotis:</b><p>“Ciao, bella. Mi manchi! 🥺”</p></div>
  <div class="photo-card"><img class="photo-shot wide" alt="Professor selfie" src="${PHOTOS.professor}"><div class="caption">Professor surveillance mode: ON</div></div>
  <div id="choices"></div><p class="feedback" id="feed"></p><button class="btn good" id="continue" disabled>▶ NEXT EXAM</button>`);
  const opts=[
    ['Mi manchi anche tu ❤️','Professor’s strict face has completely disappeared.'],
    ['Pizza first. Feelings later. 🍕','Your priorities are highly Italian.'],
    ['One time in my life, I think I am too competitive. 🏆','An extremely competitive answer. The professor has requested a rematch.'],
    ['Sei strano, Panagiotis. 🤨','Correct. He has been called weird before.']
  ];
  const root=document.getElementById('choices');
  opts.forEach(([label,reply])=>{let b=document.createElement('button');b.className='btn alt';b.textContent=label;b.onclick=()=>{sound();document.getElementById('feed').textContent=reply;document.getElementById('continue').disabled=false;root.querySelectorAll('button').forEach(x=>x.disabled=true)};root.append(b)});
  document.getElementById('continue').onclick=next;
}
function showQuiz(){if(quizAt>=quiz.length){score+=1;return next()}const item=quiz[quizAt];draw(heading('02','ITALIAN QUIZ',`Question ${quizAt+1} of ${quiz.length}. Professor is watching. 👀`)+`<div class="box"><b>${item.q}</b></div><div id="answers"></div><p class="feedback" id="feed"></p><button class="btn good" id="continue" disabled>${quizAt===quiz.length-1?'▶ NEXT EXAM':'▶ NEXT QUESTION'}</button>`);const a=document.getElementById('answers');item.a.forEach((option,i)=>{let b=document.createElement('button');b.className='btn alt';b.textContent=option;b.onclick=()=>{a.querySelectorAll('button').forEach(x=>x.disabled=true);b.className='btn '+(i===item.ok?'good':'bad');if(i===item.ok)score++;sound(i===item.ok);document.getElementById('feed').textContent=i===item.ok?item.reply:'MAMMA MIA! The correct answer is: '+item.a[item.ok]+'.';document.getElementById('continue').disabled=false};a.append(b)});document.getElementById('continue').onclick=()=>{quizAt++;showQuiz()}}
function showWords(){if(wordAt>=words.length){score++;return next()}chosen=[];const w=words[wordAt];const mixed=wordAt%2?[...w.parts]:[...w.parts].reverse();draw(heading('03','WORD SCRAMBLE',`Arrange the phrase · ${wordAt+1}/${words.length}`)+`<div class="box">Hint: ${w.hint}</div><div class="slots" id="slots" aria-label="Selected words"></div><div class="chips" id="chips"></div><p class="feedback" id="feed"></p><button class="btn alt" id="reset">↺ CLEAR</button><button class="btn good" id="check" disabled>✓ CHECK ANSWER</button>`);let slots=document.getElementById('slots'),chips=document.getElementById('chips');mixed.forEach((p,i)=>{let b=document.createElement('button');b.className='chip';b.textContent=p;b.onclick=()=>{chosen.push({p,b});b.disabled=true;const c=document.createElement('button');c.className='chip';c.textContent=p;c.onclick=()=>{chosen=chosen.filter(v=>v.b!==b);b.disabled=false;c.remove();document.getElementById('check').disabled=chosen.length!==w.parts.length};slots.append(c);document.getElementById('check').disabled=chosen.length!==w.parts.length;beep(480)};chips.append(b)});document.getElementById('reset').onclick=()=>showWords();document.getElementById('check').onclick=()=>{if(chosen.map(x=>x.p).join(' ')===w.answer){sound();wordAt++;showWords()}else{sound(false);document.getElementById('feed').textContent='Professor says: “Again, per favore!”';setTimeout(()=>{if(stage===3)showWords()},650)}}
}
function showMemory(){
  const symbols=['CIAO','HELLO','GRAZIE','THANKS','AMORE','LOVE','PIZZA','PIZZA!'];
  const pairs=[0,1,2,3,4,5,6,7];
  const shuffled=[...pairs].sort(()=>Math.random()-.5).concat([...pairs].sort(()=>Math.random()-.5));
  matched=0;turns=0;matchFirst=null;lock=false;
  draw(heading('04','MEMORY MATCH','Find 8 matching pairs. Yes, Professor Panagiotis is counting.')+`
    <div class="photo-card"><img class="photo-shot" alt="Kami dressed up" src="${PHOTOS.kamiBlue}"><div class="caption">Study break approved by the academy.</div></div>
    <div class="box mini" id="mstatus">Pairs: 0 / 8 · Attempts: 0</div>
    <div class="cardgrid" id="cards"></div><p class="feedback" id="feed"></p><button class="btn good" id="continue" disabled>▶ FINAL EXAM</button>`);
  const board=document.getElementById('cards');
  shuffled.forEach((id,index)=>{let b=document.createElement('button');b.className='tile';b.textContent='?';b.setAttribute('aria-label','Hidden card '+(index+1));b.onclick=()=>{if(lock||b.classList.contains('open')||b.classList.contains('done'))return;b.classList.add('open');b.textContent=symbols[id];beep(540,.06);if(!matchFirst){matchFirst={id,b};return}turns++;if(matchFirst.id===id){b.classList.add('done');matchFirst.b.classList.add('done');matched++;sound();matchFirst=null;document.getElementById('mstatus').textContent=`Pairs: ${matched} / 8 · Attempts: ${turns}`;if(matched===8){score++;document.getElementById('feed').textContent='Perfecto! (Professor means perfetto.)';document.getElementById('continue').disabled=false}}else{lock=true;let previous=matchFirst.b;matchFirst=null;document.getElementById('mstatus').textContent=`Pairs: ${matched} / 8 · Attempts: ${turns}`;setTimeout(()=>{previous.classList.remove('open');b.classList.remove('open');previous.textContent='?';b.textContent='?';lock=false},850)}};board.append(b)});
  document.getElementById('continue').onclick=next;
}
function showPasta(){pastaAt=0;pastaCorrect=0;seconds=30;draw(heading('05','PASTA RUSH','Serve the correct dish before the kitchen closes!')+`<div class="box center"><div class="timer" id="clock">00:30</div><p id="order" class="order"></p></div><div class="two" id="pchoices"></div><p class="feedback" id="feed"></p><button class="btn good" id="finish" style="display:none">▶ RECEIVE RESULTS</button>`);gameTimer=setInterval(()=>{seconds--;document.getElementById('clock').textContent='00:'+String(Math.max(seconds,0)).padStart(2,'0');if(seconds<=0)finishPasta()},1000);serve()}
function serve(){if(stage!==5)return;if(pastaAt>=pasta.length)return finishPasta();const dish=pasta[pastaAt];document.getElementById('order').textContent=`ORDER ${pastaAt+1}/4: ${dish.want}`;const root=document.getElementById('pchoices');root.replaceChildren();dish.options.forEach((txt,i)=>{let b=document.createElement('button');b.className='btn alt';b.textContent=txt;b.onclick=()=>{if(i===dish.ok){pastaCorrect++;score++;sound();document.getElementById('feed').textContent='BRAVISSIMA! 🍝'}else{sound(false);document.getElementById('feed').textContent='MAMMA MIA! Try the next order.'}pastaAt++;serve()};root.append(b)})}
function finishPasta(){clearInterval(gameTimer);gameTimer=null;document.getElementById('pchoices').replaceChildren();document.getElementById('order').textContent=`Kitchen closed · ${pastaCorrect}/4 orders correct`;document.getElementById('feed').textContent=pastaCorrect===4?'CHEF KAMI IS UNSTOPPABLE.':'The chef has survived. Barely.';document.getElementById('finish').style.display='block';document.getElementById('finish').onclick=next}
function finale(){draw(`
  <div class="tag">OFFICIAL* RESULTS · *NOT REALLY</div>
  <div class="prof">🏆</div>
  <h1 class="hero center">CONGRATULAZIONI,<br>KAMI!</h1>
  <div class="box center"><b>CERTIFICATO DI ITALIANO E AMORE</b><br>Issued by: Professor Panagiotis<br>Grade: ${score>=9?'A+ · SUSPICIOUSLY TALENTED':'PASS · PROFESSOR WAS BRIBED WITH CUTENESS'}<br>Bonus: unlimited retakes</div>
  <div class="stamp">APPROVED WITH DRAMATIC RESERVATIONS</div>
  <p class="center">One time in my life, I think I am too competitive...<br><b>...and somehow you still won. 🤨❤️</b></p>
  <div class="photo-grid">
    <div class="photo-card"><img class="photo-shot" alt="Kami mirror selfie" src="${PHOTOS.kamiHome}"><div class="caption">Student of the day: Kami</div></div>
    <div class="photo-card"><img class="photo-shot wide" alt="Panagiotis in the city" src="${PHOTOS.professor}"><div class="caption">Strict professor on an educational field trip</div></div>
    <div class="photo-card"><img class="photo-shot" alt="Kami blue dress" src="${PHOTOS.kamiBlue}"><div class="caption">Best dressed candidate in academy history</div></div>
  </div>
  <div class="box center">Final oral examination:<br><b>“Who is the professor's favorite student?”</b></div>
  <button class="btn alt" id="reveal">🔒 REVEAL THE ANSWER</button>
  <p class="feedback center" id="secret"></p>
  <button class="btn good" id="again">↺ TAKE THE EXAM AGAIN</button>
`);
  document.getElementById('reveal').onclick=()=>{sound();document.getElementById('secret').textContent='It’s you, obviously. Sei la mia persona preferita. ❤️ — Panagiotis';document.getElementById('reveal').disabled=true};
  document.getElementById('again').onclick=reset;
}
function reset(){clearInterval(gameTimer);stage=0;score=0;quizAt=0;wordAt=0;chosen=[];matched=0;turns=0;pastaAt=0;pastaCorrect=0;render()}
// No localStorage or sessionStorage: every fresh page load restarts the game.
reset();
</script>
</body>
</html>
